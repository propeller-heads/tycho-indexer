substreams_yaml_path: ./base-tessera.yaml
protocol_system: "vm:tessera"
module_name: "map_protocol_changes"
protocol_type_names:
  - "tessera_pair"

adapter_contract: "TesseraSwapAdapter"
adapter_build_signature: "constructor(address)"
adapter_build_args: "0x55555522005BcAE1c2424D474BfD5ed477749E3e"

# The harness's balance check compares indexed balances against `balanceOf(<component id>)`, and
# a Tessera pair contract holds nothing — all inventory sits in the treasury (`balance_owner`),
# which the check does not consult. The indexed WETH/USDC balances over this range equal the
# treasury's on-chain `balanceOf` at the stop block to the wei (HANDOVER §12); the check is
# skipped only because it asks the wrong address.
skip_balance_check: true

# No `initialized_accounts`: the range starts at the package's initial block, before TesseraSwap
# and the engine are deployed (37,518,648), so their creation code and every storage write are
# witnessed by the substreams exactly as in a production sync. This is also the only option on
# Base — the archive nodes available to the harness answer `null` to `debug_storageRangeAt`, so
# an account bootstrap from RPC cannot work here. The contracts a pair delegatecalls into reach
# the simulation as `stateless_contract_addr_{i}` attributes and are fetched over `RPC_URL`,
# exactly as a production consumer does.

tests:
  - name: test_genesis_pairs_discovery_and_simulation
    # Covers the venue's first 800 blocks: TesseraSwap + engine deployment (37,518,648), the
    # creation of the first pairs at 37,518,780 (the owner Safe calls the engine — tx
    # 0x8978cc5e…29c6 — which internally CREATEs each pair contract; the pair's init writes of the
    # EIP-1967 impl slot + base/quote token slots plus the engine's registry write at the derived
    # mapping slot are the discovery signal), treasury seeding, the first price posts (from
    # 37,519,101) and the venue's first swap (37,519,381). The stop block sits two blocks after a
    # price post so the WETH/USDC pair quotes at simulation time — Tessera's freshness gate zeroes
    # quotes when the last post is older than ~20 blocks. Only the WETH/USDC pair is enumerated;
    # the other pairs created in the same transaction are asserted by the same discovery rule.
    start_block: 37518600
    stop_block: 37519400
    expected_components:
      - id: "0xf524c1bc1c64a2c99bc7eccf19ede9a1d89d5a7c"
        tokens:
          - "0x4200000000000000000000000000000000000006" # WETH
          - "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913" # USDC
        static_attributes:
          base_token: "0x4200000000000000000000000000000000000006"
          quote_token: "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"
          manual_updates: "0x01"
          self_contained_tokens: "0x5b22307834323030303030303030303030303030303030303030303030303030303030303030303030303036222c22307838333335383966636436656462366530386634633763333264346637316235346264613032393133225d"
        creation_tx: "0x8978cc5e137cde75d4aaf4323d493511858971c05860b00abc2d6a922a5e29c6"
        # The genesis-era pair implementation (gen-1, `0xf3be571a…`) reverts the view quote when
        # it is called from a non-whitelisted caller in a zero-gas-price environment (arithmetic
        # panic in the fee-threshold branch; reproduced on a Base fork at this block — on-chain
        # `eth_call` only succeeds because nodes zero the base fee). Later generations do not have
        # that branch. This test therefore proves the delivery chain — indexing, discovery,
        # snapshot, and the consumer loading the implementation from `stateless_contract_addr_0`
        # over RPC — while quoting itself is validated on a gen-12 fork in
        # protocols/adapter-integration/evm/test/TesseraSwapAdapter.t.sol (block 50,548,423).
        skip_simulation: true
        # No vm:tessera executor is deployed on Base yet; execution is
        # validated in Foundry (crates/tycho-execution/contracts/test/
        # protocols/Tessera.t.sol) until the rollout phase deploys one.
        skip_execution: true
